
name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test cPanel connection
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          echo "Testing cPanel connection..."

          if [[ "$CPANEL_HOST" == https://* ]]; then
            echo "ERROR: CPANEL_HOST starts with https://"
            exit 1
          fi

          if [[ "$CPANEL_HOST" == */* ]]; then
            echo "ERROR: CPANEL_HOST contains /"
            exit 1
          fi

          echo "CPANEL_HOST format looks correct."

          curl --fail-with-body -sS \
            "https://${CPANEL_HOST}:2083/"

      - name: Wait
        run: echo "Connection test completed."
