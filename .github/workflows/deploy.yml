name: Test cPanel Secrets

on:
  push:
    branches:
      - main

jobs:
  test-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub Secrets
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          echo "Checking GitHub Secrets..."

          if [ -n "$CPANEL_USERNAME" ]; then
            echo "CPANEL_USERNAME = SET"
          else
            echo "CPANEL_USERNAME = EMPTY"
          fi

          if [ -n "$CPANEL_API_TOKEN" ]; then
            echo "CPANEL_API_TOKEN = SET"
          else
            echo "CPANEL_API_TOKEN = EMPTY"
          fi

          if [ -n "$CPANEL_REPOSITORY_ROOT" ]; then
            echo "CPANEL_REPOSITORY_ROOT = SET"
          else
            echo "CPANEL_REPOSITORY_ROOT = EMPTY"
          fi

          if [ -n "$CPANEL_HOST" ]; then
            echo "CPANEL_HOST = SET"
          else
            echo "CPANEL_HOST = EMPTY"
          fi
