name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the commit that triggered this deployment
      # --------------------------------------------------
      - name: Show GitHub commit
        run: |
          echo "GitHub commit to deploy:"
          echo "${{ github.sha }}"

      # --------------------------------------------------
      # 2. Tell cPanel to update the repository from GitHub
      # --------------------------------------------------
      - name: Pull latest code from GitHub to cPanel
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          echo "Updating cPanel repository..."

          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            --get \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            --data-urlencode "branch=main" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update")

          echo "cPanel update response:"
          echo "$RESPONSE"

      # --------------------------------------------------
      # 3. Give cPanel a moment to finish the queued task
      # --------------------------------------------------
      - name: Wait for cPanel Git update
        run: |
          echo "Waiting for cPanel Git update..."
          sleep 5

      # --------------------------------------------------
      # 4. Deploy the updated cPanel repository
      # --------------------------------------------------
      - name: Deploy to website
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          echo "Deploying latest commit..."

          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            --get \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create")

          echo "cPanel deployment response:"
          echo "$RESPONSE"

          echo "Deployment completed successfully."
